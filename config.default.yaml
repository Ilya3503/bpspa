server:
  host: 0.0.0.0
  port: 8000
capture:
  n_views: 1
  video_feed_fps: 1
  width: 1280
  height: 720
  fps: 6
  pixel_crop:
    left: 300
    right: 200
    top: 150
    bottom: 0
merge:
  calibration_file: T_camB_to_camA.npy
  voxel_size: 0.002
preprocessing:
  roi:
    x:
    - -0.35
    - 0.45
    y:
    - -0.25
    - 0.25
    z:
    - 0.55
    - 0.86
  voxel_size: 0.002
  nb_neighbors: 20
  std_ratio: 2.0
plane_removal:
  enabled: true
  distance_threshold: 0.01
  ransac_n: 3
  num_iterations: 1000
dbscan:
  eps: 0.025
  min_points: 50
  min_extent: 0.02
  max_extent: 0.3
global_registration:
  enabled: true
  voxel_size: 0.002
  normal_radius_factor: 2.0
  fpfh_radius_factor: 5.0
  fpfh_max_nn: 100
  ransac_n: 3
  distance_threshold_factor: 1.5
  edge_length_threshold: 0.9
  mutual_filter: true
  max_iterations: 100000
  confidence: 0.999
  min_fitness: 0.1
iterative_match:
  enabled: false
  max_instances: 5
  min_fitness: 0.12
  min_remaining_points: 200
  inlier_radius: 0.005
icp:
  cad_file: Cube_70x70x70_m.ply
  voxel_size: 0.002
  max_correspondence_distance: 0.015
  max_iterations: 50
  fitness_threshold: 0.24
robot:
  enabled: false
  urdf_path: robot/models/mycobot.urdf
  use_gui: true
  grasp_offset_z: 0.05
  pregrasp_offset_z: 0.12
planar_fallback:
  enabled: false
  trigger_max_fitness: 0.2
  k_neighbors: 30
  theta_threshold_deg: 8.0
  curvature_threshold: 0.05
  min_region_points: 200
  max_regions: 20
  max_edge_dist: 0.005
  squareness_tolerance: 0.3
  size_tolerance: 0.3